<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cat Classifier</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    p.sub { color: #666; margin-top: 0; }
    #preview { display: none; max-width: 100%; max-height: 320px; margin: 16px 0; border-radius: 8px; }
    button { background: #e2733a; color: #fff; border: 0; padding: 10px 20px; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #result { margin-top: 20px; }
    .verdict { font-size: 20px; font-weight: 600; }
    table { border-collapse: collapse; margin-top: 10px; width: 100%; }
    td { padding: 6px 8px; border-bottom: 1px solid #eee; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Cat Classifier</h1>
  <p class="sub">Upload a cat photo and find out which kind it is.</p>

  <input type="file" id="file" accept="image/*">
  <img id="preview" alt="Preview">
  <div><button id="go" disabled>Classify</button></div>

  <div id="result"></div>

  <script>
    const fileInput = document.getElementById("file");
    const preview = document.getElementById("preview");
    const button = document.getElementById("go");
    const result = document.getElementById("result");

    // Show a preview and enable the button once a file is chosen
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      button.disabled = false;
      result.innerHTML = "";
    });

    // Send the image to our Flask backend, which asks the Cog container
    button.addEventListener("click", async () => {
      const form = new FormData();
      form.append("image", fileInput.files[0]);
      button.disabled = true;
      result.textContent = "Classifying...";

      try {
        const response = await fetch("/classify", { method: "POST", body: form });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");

        const rows = data.top5.map(
          (item) => `<tr><td>${item.class}</td><td>${(item.confidence * 100).toFixed(1)}%</td></tr>`
        ).join("");
        const verdict = data.is_cat
          ? `It looks like a cat: <b>${data.predicted_class}</b> (${(data.confidence * 100).toFixed(1)}%)`
          : `This does not look like a cat. Best guess: <b>${data.predicted_class}</b> (${(data.confidence * 100).toFixed(1)}%)`;
        result.innerHTML = `<div class="verdict">${verdict}</div><table>${rows}</table>`;
      } catch (error) {
        result.innerHTML = `<div class="error">${error.message}</div>`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
