<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream Canvas</title>
<style>
  :root { --bg:#0f1020; --card:#1a1c33; --line:#2c2f55; --accent:#7c5cff; --text:#eceeff; --muted:#9aa0d0; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; justify-content:center; background:var(--bg);
         color:var(--text); font-family: system-ui, sans-serif; }
  main { width:100%; max-width:420px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  header { display:flex; align-items:center; gap:12px; }
  h1 { flex:1; margin:0; padding:12px 16px; font-size:1.2rem; text-align:center;
       background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .logo { width:48px; height:48px; border-radius:50%; background:var(--accent);
          display:grid; place-items:center; font-size:1.5rem; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; }
  #imageBox { position:relative; aspect-ratio:1/1; display:grid; place-items:center; overflow:hidden; color:var(--muted); }
  #imageBox img { width:100%; height:100%; object-fit:cover; }
  #paintBtn { position:absolute; right:10px; bottom:10px; }
  #prompt, #message { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px;
         background:var(--card); color:var(--text); font-size:1rem; }
  #chat { height:200px; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:8px 12px; border-radius:12px; font-size:.95rem; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--accent); }
  .bot { align-self:flex-start; background:#2a2d52; }
  .bar { display:flex; gap:8px; align-items:center; }
  .round { width:48px; height:48px; border-radius:50%; border:none; background:var(--accent);
           color:white; font-size:1.2rem; cursor:pointer; flex:none; }
  .round:disabled { opacity:.5; cursor:wait; }
  .round.rec { background:#e5484d; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 8px rgba(229,72,77,.25); } }
  #status { color:var(--muted); font-size:.8rem; min-height:1em; text-align:center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Dream Canvas</h1>
    <div class="logo">🎨</div>
  </header>

  <div id="imageBox" class="box">
    <span id="placeholder">Your image will appear here</span>
    <button id="paintBtn" class="round" title="Generate image">🖌️</button>
  </div>

  <input id="prompt" placeholder="Image prompt, e.g. a fox in a neon forest, digital art">

  <div id="chat" class="box"></div>

  <div class="bar">
    <button id="micBtn" class="round" title="Speak">🎤</button>
    <input id="message" placeholder="Type or speak a message">
    <button id="sendBtn" class="round" title="Send">➤</button>
  </div>
  <div id="status"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const history = [];   // chat messages sent to the model
const status = t => $("status").textContent = t;

// ---------- Chat history UI ----------
function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  d.textContent = text;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
}

// ---------- Feature 2a: send message to chatbot ----------
async function sendMessage() {
  const text = $("message").value.trim();
  if (!text) return;
  $("message").value = "";
  addMsg("user", text);
  history.push({ role: "user", content: text });
  $("sendBtn").disabled = true;
  status("Chatbot is thinking...");
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    if (!r.ok) throw new Error(await r.text());
    const { reply } = await r.json();
    history.push({ role: "assistant", content: reply });
    addMsg("bot", reply);
    status("");
  } catch (e) { status("Chat error: " + e.message); }
  $("sendBtn").disabled = false;
}

// ---------- Feature 1: generate image from prompt ----------
async function paint() {
  const prompt = $("prompt").value.trim();
  if (!prompt) return status("Write an image prompt first.");
  $("paintBtn").disabled = true;
  status("Painting... (first run loads the model, be patient)");
  try {
    const r = await fetch("/api/image", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt })
    });
    if (!r.ok) throw new Error(await r.text());
    const { image } = await r.json();
    $("placeholder").remove?.();
    let img = $("imageBox").querySelector("img");
    if (!img) { img = document.createElement("img"); $("imageBox").prepend(img); }
    img.src = image;
    status("");
  } catch (e) { status("Image error: " + e.message); }
  $("paintBtn").disabled = false;
}

// ---------- Feature 2b: speech to text (Web Speech API) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$("micBtn").onclick = () => {
  if (!SR) return status("Speech recognition not supported. Use Chrome or Safari.");
  if (rec) { rec.stop(); return; }
  rec = new SR();
  rec.lang = "en-US";
  rec.interimResults = true;
  rec.onstart = () => { $("micBtn").classList.add("rec"); status("Listening..."); };
  rec.onresult = e => {
    $("message").value = Array.from(e.results).map(r => r[0].transcript).join("");
  };
  rec.onerror = e => status("Mic error: " + e.error);
  rec.onend = () => { rec = null; $("micBtn").classList.remove("rec"); status(""); };
  rec.start();
};

$("sendBtn").onclick = sendMessage;
$("message").addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
$("paintBtn").onclick = paint;
</script>
</body>
</html>
