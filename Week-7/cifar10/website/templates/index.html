<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIFAR10 Classifier</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    p.sub { color: #666; margin-top: 0; }
    #preview { display: none; max-width: 100%; max-height: 280px; margin: 16px 0; border-radius: 8px; }
    button { background: #2f6fed; color: #fff; border: 0; padding: 10px 20px; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #results { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
    .card { flex: 1 1 280px; border: 1px solid #e3e3e3; border-radius: 8px; padding: 14px; }
    .card h2 { margin: 0 0 8px; font-size: 16px; color: #555; }
    .verdict { font-size: 20px; font-weight: 600; }
    table { border-collapse: collapse; margin-top: 10px; width: 100%; }
    td { padding: 6px 8px; border-bottom: 1px solid #eee; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>CIFAR10 Classifier</h1>
  <p class="sub">Upload a photo of an airplane, automobile, bird, cat, deer, dog, frog, horse, ship or truck.</p>

  <input type="file" id="file" accept="image/*">
  <img id="preview" alt="Preview">
  <div><button id="go" disabled>Classify</button></div>

  <div id="results"></div>

  <script>
    const MODELS = {{ models | tojson }};
    const fileInput = document.getElementById("file");
    const preview = document.getElementById("preview");
    const button = document.getElementById("go");
    const results = document.getElementById("results");

    // Show a preview and enable the button once a file is chosen
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      button.disabled = false;
      results.innerHTML = "";
    });

    // Build the result card of one model
    function renderCard(name, data) {
      if (data.error) {
        return `<div class="card"><h2>${name}</h2><div class="error">${data.error}</div></div>`;
      }
      const rows = data.top5.map(
        (item) => `<tr><td>${item.class}</td><td>${(item.confidence * 100).toFixed(1)}%</td></tr>`
      ).join("");
      return `<div class="card"><h2>${name}</h2>
        <div class="verdict">${data.predicted_class} (${(data.confidence * 100).toFixed(1)}%)</div>
        <table>${rows}</table></div>`;
    }

    // Send the image to our Flask backend, which asks the Cog container(s)
    button.addEventListener("click", async () => {
      const form = new FormData();
      form.append("image", fileInput.files[0]);
      button.disabled = true;
      results.textContent = "Classifying...";

      try {
        const response = await fetch("/classify", { method: "POST", body: form });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        results.innerHTML = MODELS.map((name) => renderCard(name, data[name])).join("");
      } catch (error) {
        results.innerHTML = `<div class="error">${error.message}</div>`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
